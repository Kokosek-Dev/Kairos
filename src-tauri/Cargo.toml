[package]
name = "kairos"
version = "0.1.0"
description = "Kairos, an independent Minecraft: Java Edition launcher"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kairos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "time", "macros", "process"] }
tokio-util = "0.7"
reqwest = { version = "0.13", features = ["json", "stream", "form", "multipart"] }
futures-util = "0.3"
sha1 = "0.11"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
hex = "0.4"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
getrandom = "0.3"
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
tauri-plugin-updater = "2"
discord-rich-presence = "1.1.0"

