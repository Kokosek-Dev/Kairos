[package]
name = "voidlight"
version = "0.1.0"
description = "Voidlight, an independent Minecraft: Java Edition launcher"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "voidlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
