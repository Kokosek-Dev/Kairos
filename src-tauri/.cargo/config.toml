# Build-time settings for Kairos.
#
# KAIROS_MS_CLIENT_ID is the Application (client) ID of the Azure app registration that Kairos
# uses for "Sign in with Microsoft" (see docs/AZURE_SETUP.md). It is baked into the launcher so
# players never have to enter it. Client IDs are public identifiers, not secrets.
[env]
KAIROS_MS_CLIENT_ID = { value = "", force = false }
