name: Release

# Every change pushed to main becomes a new release, so installed launchers update themselves.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "mod/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Set the version
        shell: pwsh
        run: |
          $version = "0.1.${{ github.run_number }}"
          function Set-Version($path, $pattern) {
            $text = Get-Content $path -Raw
            $updated = [regex]::new($pattern, 'Multiline').Replace($text, "`${1}$version`${2}", 1)
            if ($updated -eq $text) { throw "No version found in $path" }
            [IO.File]::WriteAllText((Resolve-Path $path), $updated, (New-Object Text.UTF8Encoding $false))
          }
          Set-Version package.json '("version":\s*")[^"]*(")'
          Set-Version src-tauri/tauri.conf.json '("version":\s*")[^"]*(")'
          Set-Version src-tauri/Cargo.toml '(^version\s*=\s*")[^"]*(")'
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          KAIROS_MS_CLIENT_ID: ${{ secrets.KAIROS_MS_CLIENT_ID }}
          KAIROS_DISCORD_APP_ID: ${{ secrets.KAIROS_DISCORD_APP_ID }}
          KAIROS_NEWS_URL: ${{ vars.KAIROS_NEWS_URL }}
          KAIROS_FEEDBACK_KEY: ${{ secrets.KAIROS_FEEDBACK_KEY }}
        with:
          tagName: v${{ env.VERSION }}
          releaseName: Kairos v${{ env.VERSION }}
          releaseBody: Download the installer below and compare it with SHA256SUMS.txt.
          args: --bundles nsis
      - name: Publish checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe
          $installers | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content SHA256SUMS.txt
          gh release upload "v${{ env.VERSION }}" SHA256SUMS.txt --clobber
